<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Plastic Promise distribution profiles</title>
  <desc id="desc">Two supported deployment profiles share one asynchronous admission contract: local all-in-one and split client-server with server-owned canonical state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font:700 34px system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:400 16px system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .section{font:700 14px system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#67e8f9;letter-spacing:.08em}
      .label{font:700 18px system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .body{font:400 14px system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#dbeafe}
      .small{font:400 12px system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#94a3b8}
      .frame{fill:#0f172a;stroke:#334155;stroke-width:1.2}
      .local{fill:#052e2b;stroke:#2dd4bf;stroke-width:1.6}
      .split{fill:#172554;stroke:#60a5fa;stroke-width:1.6}
      .async{fill:#2e1065;stroke:#c084fc;stroke-width:1.6}
      .store{fill:#052e16;stroke:#4ade80;stroke-width:1.4}
      .client{fill:#1e293b;stroke:#38bdf8;stroke-width:1.4}
      .server{fill:#111827;stroke:#818cf8;stroke-width:1.4}
      .arrow{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dashed{stroke:#64748b;stroke-width:1.6;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1280" height="760" rx="28" fill="#0b1220"/>
  <text x="56" y="58" class="title">Plastic Promise Distribution Profiles</text>
  <text x="56" y="86" class="subtitle">One release contract, two deployment topologies, one asynchronous admission path</text>

  <text x="56" y="132" class="section">SUPPORTED PROFILES</text>
  <rect x="56" y="150" width="552" height="344" rx="20" class="local"/>
  <text x="84" y="190" class="label">local-all-in-one</text>
  <text x="84" y="216" class="body">Everything runs on one local host.</text>
  <rect x="84" y="244" width="226" height="78" rx="12" class="client"/>
  <text x="106" y="276" class="label">Client + Dashboard</text>
  <text x="106" y="299" class="small">Codex, browser, loopback</text>
  <rect x="354" y="244" width="226" height="78" rx="12" class="server"/>
  <text x="376" y="276" class="label">MCP + Workers</text>
  <text x="376" y="299" class="small">runtime, maintenance, hooks</text>
  <path class="arrow" d="M310 283 H354"/>
  <rect x="84" y="358" width="226" height="82" rx="12" class="store"/>
  <text x="106" y="391" class="label">SQLite</text>
  <text x="106" y="414" class="small">canonical writable state</text>
  <rect x="354" y="358" width="226" height="82" rx="12" class="store"/>
  <text x="376" y="391" class="label">LanceDB</text>
  <text x="376" y="414" class="small">derived rebuildable index</text>
  <path class="dashed" d="M467 322 V358"/>
  <path class="dashed" d="M197 322 V358"/>

  <rect x="672" y="150" width="552" height="344" rx="20" class="split"/>
  <text x="700" y="190" class="label">split-async (default)</text>
  <text x="700" y="216" class="body">Client access is separate from server truth.</text>
  <rect x="700" y="244" width="226" height="78" rx="12" class="client"/>
  <text x="722" y="276" class="label">Client</text>
  <text x="722" y="299" class="small">Codex, dashboard, bounded cache</text>
  <rect x="970" y="244" width="226" height="78" rx="12" class="server"/>
  <text x="992" y="276" class="label">Server Runtime</text>
  <text x="992" y="299" class="small">MCP, workers, async ownership</text>
  <path class="arrow" d="M926 283 H970"/>
  <text x="928" y="266" class="small">secure tunnel</text>
  <rect x="700" y="358" width="226" height="82" rx="12" class="store"/>
  <text x="722" y="391" class="label">SQLite</text>
  <text x="722" y="414" class="small">server-only canonical state</text>
  <rect x="970" y="358" width="226" height="82" rx="12" class="store"/>
  <text x="992" y="391" class="label">LanceDB</text>
  <text x="992" y="414" class="small">server-derived index</text>
  <path class="dashed" d="M1083 322 V358"/>
  <path class="dashed" d="M813 322 V358"/>

  <text x="56" y="540" class="section">SHARED ASYNC CONTRACT</text>
  <rect x="56" y="558" width="1168" height="128" rx="20" class="async"/>
  <text x="86" y="596" class="label">canonical enqueue</text>
  <text x="86" y="621" class="small">ack only after durable admission</text>
  <path class="arrow" d="M252 616 H330"/>
  <text x="350" y="596" class="label">durable outbox</text>
  <text x="350" y="621" class="small">SQLite-backed work intent</text>
  <path class="arrow" d="M520 616 H598"/>
  <text x="618" y="596" class="label">bounded batch</text>
  <text x="618" y="621" class="small">async embedding / enrichment</text>
  <path class="arrow" d="M764 616 H842"/>
  <text x="862" y="596" class="label">retry + reconcile</text>
  <text x="862" y="621" class="small">persistent state, project-isolated</text>
  <text x="86" y="662" class="small">The client cache is never a second writable canonical database.</text>
</svg>
