[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plastic-promise"
version = "0.2.16"
description = "AI 行为治理系统 — 以约定工程替代约束工程"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Plastic Promise Contributors" },
]
keywords = [
    "ai-governance",
    "mcp-server",
    "agent-memory",
    "commitment-engineering",
    "context-engine",
    "llm-agent",
    "multi-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "lancedb>=0.34.0",
    "uvicorn[standard]>=0.27.0",
    "starlette>=0.36.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.1,<7.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
local-inference = [
    # CrossEncoder support for Qwen3-Reranker requires transformers>=4.51
    # and a sentence-transformers release with CrossEncoder prompt support.
    "sentence-transformers>=3.4.1",
    "transformers>=4.51.0",
]
neko = [
    "orjson>=3.10.0",
    "pyzmq>=26.0.0",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.3.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
rust = [
    "maturin>=1.4",
]
code-memory = [
    "codebase-memory-mcp>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/ALdaisuki/plastic-promise-release"
Documentation = "https://github.com/ALdaisuki/plastic-promise-release#readme"
Repository = "https://github.com/ALdaisuki/plastic-promise-release"
Issues = "https://github.com/ALdaisuki/plastic-promise-release/issues"

[project.scripts]
plastic-promise = "plastic_promise.cli:main"
plastic-promise-deploy = "plastic_promise.deployment.cli:main"
plastic-promise-http = "plastic_promise:main_http"
plastic-promise-streamable-http = "plastic_promise:main_streamable_http"
plastic-promise-canonical-runtime = "plastic_promise.deployment.runtime_lock:main"
plastic-promise-sse = "plastic_promise:main_sse"
plastic-promise-inference-gateway = "plastic_promise.mcp.inference_gateway_server:main"
plastic-promise-knowledge-ingest = "plastic_promise.knowledge.server:main"
plastic-promise-control-plane = "plastic_promise.mcp.control_plane_server:main"
plastic-promise-local-inference-node = "plastic_promise.local_inference_node.server:main"
plastic-promise-local-inference-cache-plan = "plastic_promise.local_inference_node.cache_planner:main"
plastic-promise-release-builder = "plastic_promise.release_builder.cli:main"

[tool.setuptools.packages.find]
include = ["plastic_promise*"]
exclude = [
    "data*",
    "daemons*",
    "experience_packs*",
    "plugins*",
    "rust*",
    "skills*",
    "tests*",
    "var*",
]

[tool.setuptools.package-data]
"plastic_promise.mcp.dashboard_v2" = ["static/*.html", "static/*.css", "static/*.js"]

# ============================================================
# Ruff — 代码规范 & 格式化
# ============================================================
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "rust",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking-imports
]
ignore = [
    "E501", # line-too-long (handled by formatter)
    "N818", # exception-naming (allow non-"Error" suffix)
]

[tool.ruff.lint.isort]
known-first-party = ["plastic_promise"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a running MCP server or external services",
    "slow: opt-in benchmarks or long-running regression checks",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--cov=plastic_promise",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["plastic_promise"]
omit = ["tests/*", "rust/*"]

# ============================================================
# mypy — 静态类型检查
# ============================================================
[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["rust/", "tests/", "build/", "dist/"]
