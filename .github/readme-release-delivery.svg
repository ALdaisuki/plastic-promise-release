<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Plastic Promise release delivery controls</title>
  <desc id="desc">Union Six-PR Contract revision 2026-08-18.1 defines an evidence-gated release target from source verification through RC artifacts. This diagram does not prove publication, deployment, or production acceptance.</desc>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#67e8f9"/>
    </marker>
    <style>
      .heading { fill: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; }
      .body { fill: #cbd5e1; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #94a3b8; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .box-title { fill: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: 700; }
      .box-detail { fill: #cbd5e1; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#background)" rx="28"/>
  <text x="72" y="76" class="heading" font-size="38">Plastic Promise</text>
  <text x="72" y="108" class="body" font-size="20">Union contract 2026-08-18.1 · evidence first · each publication separately authorized</text>
  <rect x="1022" y="48" width="186" height="48" rx="24" fill="#164e63" stroke="#22d3ee"/>
  <text x="1115" y="78" text-anchor="middle" class="heading" font-size="15">NO AUTO-PUBLISH</text>

  <g filter="url(#shadow)">
    <rect x="66" y="180" width="205" height="180" rx="18" fill="#1e3a5f" stroke="#38bdf8"/>
    <rect x="312" y="180" width="205" height="180" rx="18" fill="#172554" stroke="#818cf8"/>
    <rect x="558" y="180" width="205" height="180" rx="18" fill="#3f2a13" stroke="#fbbf24"/>
    <rect x="804" y="180" width="205" height="180" rx="18" fill="#3f1725" stroke="#fb7185"/>
    <rect x="1050" y="180" width="164" height="180" rx="18" fill="#14532d" stroke="#4ade80"/>
  </g>

  <text x="92" y="220" class="box-title">Immutable source</text>
  <text x="92" y="250" class="box-detail">reviewed commit</text>
  <text x="92" y="274" class="box-detail">SemVer + package version</text>
  <text x="92" y="322" class="small" font-size="12">no runtime state</text>

  <text x="338" y="220" class="box-title">PR verification</text>
  <text x="338" y="250" class="box-detail">wheel + sdist</text>
  <text x="338" y="274" class="box-detail">exact local install</text>
  <text x="338" y="322" class="small" font-size="12">OCI build, no push</text>

  <text x="584" y="220" class="box-title">RC candidate</text>
  <text x="584" y="250" class="box-detail">SBOM + OCI layouts</text>
  <text x="584" y="274" class="box-detail">14-day artifact retention</text>
  <text x="584" y="322" class="small" font-size="12">manual, non-stable</text>

  <text x="830" y="220" class="box-title">Protected stable</text>
  <text x="830" y="250" class="box-detail">GHCR digest evidence</text>
  <text x="830" y="274" class="box-detail">SBOM + attestation</text>
  <text x="830" y="322" class="small" font-size="12">requires production approval</text>

  <text x="1076" y="220" class="box-title">Release repo</text>
  <text x="1076" y="250" class="box-detail">stable-only sync</text>
  <text x="1076" y="274" class="box-detail">PyPI OIDC</text>
  <text x="1076" y="322" class="small" font-size="12">requires second approval</text>

  <path d="M271 270 H302" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M517 270 H548" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M763 270 H794" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1009 270 H1040" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="66" y="432" width="1148" height="120" rx="18" fill="#0b1220" stroke="#334155"/>
  <text x="102" y="472" class="heading" font-size="19">Release manifest binds the evidence</text>
  <text x="102" y="510" class="body" font-size="16">source SHA  •  wheel/sdist SHA-256  •  CycloneDX SBOM  •  edge/server/compute OCI digests  •  GitHub attestation</text>
  <text x="102" y="586" class="small" font-size="14">SQLite, LanceDB, models, logs, keys, and deployment environment files never enter release artifacts or container images.</text>
</svg>
