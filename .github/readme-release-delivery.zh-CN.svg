<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Plastic Promise 发行交付控制</title>
  <desc id="desc">联合六 PR 合同 revision 2026-08-18.1 定义从源码验证到 RC 制品的证据门控发行目标；此图不证明已发布、已部署或已通过 production 验收。</desc>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#67e8f9"/>
    </marker>
    <style>
      .heading { fill: #f8fafc; font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; }
      .body { fill: #cbd5e1; font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #94a3b8; font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Inter, ui-sans-serif, system-ui, sans-serif; }
      .box-title { fill: #f8fafc; font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Inter, ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: 700; }
      .box-detail { fill: #cbd5e1; font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#background)" rx="28"/>
  <text x="72" y="76" class="heading" font-size="38">Plastic Promise</text>
  <text x="72" y="108" class="body" font-size="20">联合合同 2026-08-18.1 · 证据优先 · 每种发布均需独立授权</text>
  <rect x="1022" y="48" width="186" height="48" rx="24" fill="#164e63" stroke="#22d3ee"/>
  <text x="1115" y="78" text-anchor="middle" class="heading" font-size="15">不自动发布</text>

  <g filter="url(#shadow)">
    <rect x="66" y="180" width="205" height="180" rx="18" fill="#1e3a5f" stroke="#38bdf8"/>
    <rect x="312" y="180" width="205" height="180" rx="18" fill="#172554" stroke="#818cf8"/>
    <rect x="558" y="180" width="205" height="180" rx="18" fill="#3f2a13" stroke="#fbbf24"/>
    <rect x="804" y="180" width="205" height="180" rx="18" fill="#3f1725" stroke="#fb7185"/>
    <rect x="1050" y="180" width="164" height="180" rx="18" fill="#14532d" stroke="#4ade80"/>
  </g>

  <text x="92" y="220" class="box-title">不可变源码</text>
  <text x="92" y="250" class="box-detail">已审查提交</text>
  <text x="92" y="274" class="box-detail">SemVer + 包版本</text>
  <text x="92" y="322" class="small" font-size="12">无运行时状态</text>

  <text x="338" y="220" class="box-title">PR 验证</text>
  <text x="338" y="250" class="box-detail">wheel + sdist</text>
  <text x="338" y="274" class="box-detail">严格本地安装</text>
  <text x="338" y="322" class="small" font-size="12">OCI 构建，不推送</text>

  <text x="584" y="220" class="box-title">RC 候选</text>
  <text x="584" y="250" class="box-detail">SBOM + OCI 布局</text>
  <text x="584" y="274" class="box-detail">制品保留 14 天</text>
  <text x="584" y="322" class="small" font-size="12">手动，非 stable</text>

  <text x="830" y="220" class="box-title">受保护 stable</text>
  <text x="830" y="250" class="box-detail">GHCR 摘要证据</text>
  <text x="830" y="274" class="box-detail">SBOM + 证明</text>
  <text x="830" y="322" class="small" font-size="12">需生产批准</text>

  <text x="1076" y="220" class="box-title">发行版仓库</text>
  <text x="1076" y="250" class="box-detail">仅 stable 同步</text>
  <text x="1076" y="274" class="box-detail">PyPI OIDC</text>
  <text x="1076" y="322" class="small" font-size="12">需二次批准</text>

  <path d="M271 270 H302" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M517 270 H548" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M763 270 H794" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1009 270 H1040" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="66" y="432" width="1148" height="120" rx="18" fill="#0b1220" stroke="#334155"/>
  <text x="102" y="472" class="heading" font-size="19">发行清单绑定证据</text>
  <text x="102" y="510" class="body" font-size="16">源码 SHA  •  wheel/sdist SHA-256  •  CycloneDX SBOM  •  edge/server/compute OCI 摘要  •  GitHub 证明</text>
  <text x="102" y="586" class="small" font-size="14">SQLite、LanceDB、模型、日志、密钥和部署环境文件不会进入发行制品或容器镜像。</text>
</svg>
