# Static-only local edge. No proxy_pass is permitted here: routing to the
# canonical backend is an authenticated client concern, not edge authority.
# The entrypoint writes the included bridge variable before nginx starts. It
# is empty unless an explicitly validated loopback ppctl endpoint is supplied.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /tmp/pp-local-edge-bridge-csp.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'$pp_local_edge_bridge_connect_src" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # The Dashboard reads this same-origin, generated document to learn the
    # narrow host-adapter contract. It contains no credentials, host paths,
    # Docker state, or command surface. The browser calls the loopback adapter
    # directly; this edge deliberately does not proxy it.
    location = /pp-local-edge/v1/bridge-config.json {
        access_log off;
        default_type application/json;
        alias /tmp/pp-local-edge-bridge-config.json;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'$pp_local_edge_bridge_connect_src" always;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
